name: Publish v1.0.0 GitHub Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish v1.0.0 when manifest matches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c "import json; print(json.load(open('MANIFEST.json'))['version'])")
          if [ "$VERSION" != "1.0.0" ]; then
            echo "Manifest is $VERSION; skipping v1.0.0 release."
            exit 0
          fi
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "v1.0.0 release already exists."
            exit 0
          fi
          zip -rq bd-patient-journey-analytics-v1.0.0.zip . \
            -x '.git/*' \
            -x 'bd-patient-journey-analytics-v1.0.0.zip'
          gh release create v1.0.0 \
            --target "$GITHUB_SHA" \
            --title "v1.0.0 — BD Patient Journey Analytics" \
            --notes-file releases/v1.0.0.md \
            excel/Hospital_Digital_Patient_Journey_HR_Operations_v1.0.xlsx \
            bd-patient-journey-analytics-v1.0.0.zip
