name: Build v0.1.0 Project

on:
  push:
    branches:
      - v0.1.0-build
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v0.1.0-build
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install workbook dependency
        run: pip install 'openpyxl>=3.1,<4'

      - name: Generate v0.1.0 project
        run: python scripts/build_v0_1.py

      - name: Validate v0.1.0
        run: python scripts/validate_project.py

      - name: Remove staging probe
        run: rm -f PUSH_TEST.txt

      - name: Commit generated project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "release: build complete v0.1.0 project"
            git push origin HEAD:v0.1.0-build
          fi
